# atelier 内置 harness spec — 各 CLI harness 的功能入口声明
#
# 本文件是插件自带的默认值（随 atelier 分发，插件做了适配即开箱可用）。
# 用户覆盖/扩展：~/.config/dsh-atelier/harnesses.toml（同名 harness 逐字段
# 覆盖此处，新名 harness 追加；旧路径 ~/.config/pi/atelier/harnesses.toml
# 仍作迁移回退；spec 详见 runtime/harness/spec.ts）。
#
# 字段说明：
#   binaries      = PATH 探测候选（command -v 按序试，首个命中即用）【必填】
#   herdr-kind    = herdr agent kind 名；在名单内可获得 agent_status 语义检测
#   subcommand    = 启动子命令（拼在 binary 之后，如 hermes 的 "chat"）
#   model-args    = 模型参数组（含 "{model}" 占位符；model 缺省时整组省略）
#   approval-full = peerApproval=full 时的自治 flag 组
#   approval-safe = peerApproval=safe 时的保守自动接受 flag 组
#   resume-args   = 会话恢复参数组（含 "{sessionId}" 占位符；缺省 = 不支持
#                   resume，auto-close 对该 harness 自动禁用）
#
# 占位符值做 shell 单引号转义；字面量 flag 原样输出。

# ── pi ───────────────────────────────────────────────────────────────────────
# TUI 默认无权限门（工具直接跑），approval 不产生 flag。
# resume 用 --session <id>（非交互精确恢复；--resume 是交互 picker）。

[harness.pi]
binaries = ["pi"]
herdr-kind = "pi"
model-args = ["--model", "{model}"]
resume-args = ["--session", "{sessionId}"]

# ── claude ───────────────────────────────────────────────────────────────────
# full: --dangerously-skip-permissions（无人值守前提）
# safe: --permission-mode acceptEdits（文件编辑自动接受，bash 仍弹门→blocked）

[harness.claude]
binaries = ["claude"]
herdr-kind = "claude"
model-args = ["--model", "{model}"]
approval-full = ["--dangerously-skip-permissions"]
approval-safe = ["--permission-mode", "acceptEdits"]
resume-args = ["--resume", "{sessionId}"]

# ── codex ────────────────────────────────────────────────────────────────────
# full/safe 都映射 --full-auto（workspace-write 沙箱内自动执行）；
# 彻底无沙箱用 harnessArgs 显式加 --dangerously-bypass-approvals-and-sandbox。
# resume 是子命令形态：codex resume <SESSION_ID>。

[harness.codex]
binaries = ["codex"]
herdr-kind = "codex"
model-args = ["--model", "{model}"]
approval-full = ["--full-auto"]
approval-safe = ["--full-auto"]
resume-args = ["resume", "{sessionId}"]

# ── hermes ───────────────────────────────────────────────────────────────────
# `hermes chat` 启动 TUI。模型以 "provider/model" 复合名指定，spec 拆成
# --provider + --model 两个独立参数（--model 的值不做内部路由解析，整串都是
# 模型名）；model 无斜杠时只下 --model，纯 "hermes"（无模型段）走内置默认。
# --yolo 跳过危险命令批准门——peerApproval=full 的无人值守派发必须带，否则
# peer 会 silent 阻塞在批准弹窗。

[harness.hermes]
binaries = ["hermes"]
herdr-kind = "hermes"
subcommand = "chat"
model-args = ["--provider={provider}", "--model", "{model}"]
approval-full = ["--yolo"]
resume-args = ["chat", "--resume", "{sessionId}"]

# ── opencode / omp ───────────────────────────────────────────────────────────
# 与 hermes 同构：TUI 即 binary 本身，模型走 --model 猜测。

[harness.opencode]
binaries = ["opencode"]
herdr-kind = "opencode"
model-args = ["--model", "{model}"]

[harness.omp]
binaries = ["omp"]
herdr-kind = "omp"
model-args = ["--model", "{model}"]

# ── mcode (MiniMax Code) ─────────────────────────────────────────────────────
# TUI 即 binary 本身；`-m provider/model` 原生复合名（无需 provider 拆分）。
# herdr 无原生 kind → 启动走 sendText 兜底、完成检测全靠文件契约 + transcript
# 启发（agentStatus 恒 null），是未注册 harness 路径的参考实现。
# 注意：`--permission` 是 `exec` 子命令的 flag，顶层 TUI 不认（传了会直接
# 退出回 shell）；TUI 权限策略是其会话内 "Full access" 设置，不在 CLI 面。

[harness.mcode]
binaries = ["mcode"]
model-args = ["-m", "{model}"]
resume-args = ["--session", "{sessionId}"]

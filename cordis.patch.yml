# dsh-atelier bundle patch layer.
#
# ONE host row, mounted by the bare package name. The row's specifier must be an
# exact package specifier — dsh's client-modules scanner resolves the row's
# module location and keeps only bare specifiers (`exactPackageSpecifier` rejects
# any non-scoped name containing "/"), so a subpath row such as
# `dsh-atelier/tools` makes `locatePkgJson` bail out and the `dsh.client`
# declaration is silently skipped. dsh-atelier 0.1.0 ships no browser half, but
# keep this row bare so adding one later needs no patch surgery.
#
# config 从本行下发，形如：
#
#   - id: dsh-atelier
#     config:
#       enabled: true
- insert:
    - id: dsh-atelier
      name: 'dsh-atelier'
